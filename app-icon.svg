<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Background Frame (512x512 Android Standard) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Decorative Ring -->
  <circle cx="256" cy="220" r="160" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)"/>
  <circle cx="256" cy="220" r="153" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Golden Stars & Cloud -->
  <!-- Top Star -->
  <polygon points="256,92 260,107 275,111 260,115 256,130 252,115 237,111 252,107" fill="url(#goldGrad)"/>
  <!-- Left Star -->
  <polygon points="280,122 282,132 292,134 282,136 280,146 278,136 268,134 278,132" fill="url(#goldGrad)"/>
  <!-- Right Star -->
  <polygon points="230,132 232,140 240,142 232,144 230,152 228,144 220,142 228,140" fill="url(#goldGrad)"/>
  <!-- Golden Cloud -->
  <path d="M 302,150 C 302,143 312,140 318,144 C 322,141 330,143 331,148 C 336,148 338,154 334,158 C 330,161 306,160 302,150 Z" fill="url(#goldGrad)"/>

  <!-- Goddess / Sky Mother Silhouette & Flowing Hair -->
  <path d="M 230,115 C 275,115 320,150 328,205 C 332,235 315,265 290,282 C 245,310 175,305 140,270 C 190,290 255,275 280,235 C 300,200 280,150 235,135 C 220,130 205,132 195,136 C 205,122 218,115 230,115 Z" fill="#0f172a"/>
  
  <path d="M 248,150 C 256,146 264,150 266,158 C 268,164 262,170 258,173 C 264,174 268,180 266,186 C 262,196 248,202 240,204 C 224,208 200,196 188,180 C 176,164 184,144 200,140 C 216,136 228,148 236,154 Z" fill="#0f172a"/>
  <!-- Extended Hand reaching for Cloud -->
  <path d="M 270,186 C 285,180 305,170 326,170 C 330,170 332,174 328,177 C 315,185 298,198 285,204 Z" fill="#0f172a"/>

  <!-- Hotel & Restaurant Architecture (Center) -->
  <!-- Main Multi-story Hotel Building -->
  <rect x="206" y="222" width="36" height="52" fill="#0f172a"/>
  <!-- Lighted Windows -->
  <g fill="#ffffff">
    <rect x="211" y="228" width="5" height="7"/>
    <rect x="221" y="228" width="5" height="7"/>
    <rect x="231" y="228" width="5" height="7"/>
    <rect x="211" y="240" width="5" height="7"/>
    <rect x="221" y="240" width="5" height="7"/>
    <rect x="231" y="240" width="5" height="7"/>
    <rect x="211" y="252" width="5" height="7"/>
    <rect x="221" y="252" width="5" height="7"/>
    <rect x="231" y="252" width="5" height="7"/>
  </g>
  <!-- Restaurant Pavilion Roof & Building -->
  <polygon points="242,238 290,238 280,274 242,274" fill="#0f172a"/>
  <rect x="248" y="246" width="6" height="8" fill="#ffffff"/>
  <rect x="260" y="246" width="6" height="8" fill="#ffffff"/>
  <rect x="272" y="246" width="6" height="8" fill="#ffffff"/>

  <!-- Cloche / Dining Cover & Cutlery -->
  <path d="M 288,220 A 14,14 0 0,1 316,220 Z" fill="#0f172a"/>
  <line x1="284" y1="222" x2="320" y2="222" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="324" y1="210" x2="324" y2="224" stroke="#0f172a" stroke-width="2"/>
  <line x1="328" y1="210" x2="328" y2="224" stroke="#0f172a" stroke-width="2"/>

  <!-- Brand Typography (Lower Section) -->
  <text x="256" y="425" font-family="'Times New Roman', Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Sky Mother</text>
  
  <!-- Floral / Leaf Ornament Divider -->
  <line x1="130" y1="442" x2="225" y2="442" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="256" cy="442" r="3" fill="url(#goldGrad)"/>
  <ellipse cx="246" cy="442" rx="5" ry="2.5" fill="url(#goldGrad)"/>
  <ellipse cx="266" cy="442" rx="5" ry="2.5" fill="url(#goldGrad)"/>
  <line x1="287" y1="442" x2="382" y2="442" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <text x="256" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">HOTEL &amp; RESTAURANT</text>
</svg>
