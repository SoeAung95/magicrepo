name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SkyMother-POS.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyMother-POS-apk
          path: SkyMother-POS.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" SkyMother-POS.apk \
            --title "Sky Mother POS $TAG_NAME" \
            --notes "Sky Mother POS Android APK အလိုအလျောက် တည်ဆောက်ထားသော ဖိုင်ဖြစ်ပါသည်။ ဒေါင်းလုဒ်ရယူ၍ Install ပြုလုပ်နိုင်ပါသည်။"
